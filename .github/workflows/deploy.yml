name: Deploy LocalHub to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Application (Vite Build)
        run: npm run build

      - name: Prepare SPA routing and Jekyll bypass
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      # 1. Deploy ไปยัง GitHub Pages
      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true

      # 2. Deploy ไปยัง Firebase Hosting (อัปเดตแอปตัวจริงที่ลิงก์กับ Firebase)
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        continue-on-error: true
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOCALHUB_69FBE || secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: localhub-69fbe
