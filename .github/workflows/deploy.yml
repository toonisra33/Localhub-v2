name: Deploy LocalHub to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Application (Vite Build)
        run: npm run build

      # 1. Deploy to gh-pages branch (Always succeeds, creates and updates gh-pages branch with built files)
      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages

      # 2. Setup GitHub Pages (Tries to enable Pages via API if not enabled; continue-on-error ensures job never fails)
      - name: Setup GitHub Pages
        id: pages_setup
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 3. Upload Build Artifact for GitHub Actions Pages
      - name: Upload Build Artifact
        if: steps.pages_setup.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # 4. Deploy to GitHub Pages environment
      - name: Deploy to GitHub Pages
        if: steps.pages_setup.outcome == 'success'
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
