name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
  
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies & Build Web
        run: |
          npm install
          npm run build

      - name: Generate Android Project via Google Core Engine
        run: |
          mkdir -p android-build
          cd android-build

          npm init -y
          npm install @bubblewrap/core

          # Restore original Google Play upload keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android.keystore
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.toon.localhub",
            "host": "localhub-69fbe.web.app",
            "name": "LocalHub",
            "launcherName": "LocalHub",
            "themeColor": "#10B981",
            "themeColorDark": "#111827",
            "navigationColor": "#111827",
            "navigationColorDark": "#111827",
            "navigationDividerColor": "#000000",
            "navigationDividerColorDark": "#000000",
            "backgroundColor": "#111827",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://raw.githubusercontent.com/toonisra33/localhub/main/public/icon-512.png",
            "maskableIconUrl": "https://raw.githubusercontent.com/toonisra33/localhub/main/public/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "localhub"
            },
            "appVersionName": "1.0.1",
            "appVersionCode": 2,
            "shortcuts": [],
            "generatorApp": "bubblewrap-core",
            "webManifestUrl": "https://localhub-69fbe.web.app/manifest.json",
            "fallbackType": "customtabs",
            "features": {
              "locationDelegation": {
                "enabled": true
              },
              "playBilling": {
                "enabled": false
              }
            },
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "fullScopeUrl": "https://localhub-69fbe.web.app/",
            "minSdkVersion": 21,
            "orientation": "default",
            "fingerprints": [
              {
                "value": "E5:EE:9B:81:FA:27:DE:9C:4F:17:1C:C4:3B:B1:B4:9D:1F:8B:72:5A:09:99:85:50:C2:5D:B0:53:BC:B8:26:93"
              },
              {
                "value": "F9:08:E1:42:80:4C:C0:A1:AA:BC:74:68:CC:09:3D:C1:55:A6:E0:21:34:6B:6B:32:A2:33:97:CB:84:72:93:FA"
              }
            ]
          }
          EOF

          # Run automated generator without interactive prompts
          node -e "
            const { TwaManifest, TwaGenerator } = require('@bubblewrap/core');
            const fs = require('fs');
            async function build() {
              const data = JSON.parse(fs.readFileSync('./twa-manifest.json', 'utf8'));
              const manifest = new TwaManifest(data);
              const generator = new TwaGenerator();
              await generator.createTwaProject('./', manifest);
              console.log('Android TWA Project generated successfully!');
            }
            build().catch(err => { console.error(err); process.exit(1); });
          "

            - name: Build Signed AAB Bundle with Gradle
        run: |
          cd android-build
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

          # Sign AAB with original Google Play upload keystore
          AAB_FILE=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          if [ -f "$AAB_FILE" ]; then
            jarsigner -keystore android.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" "$AAB_FILE" localhub
          fi

      - name: Upload Android App Bundle (.AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalHub-Android-Bundle-aab
          path: |
            android-build/app/build/outputs/bundle/release/*.aab
            android-build/app/build/outputs/apk/release/*.apk
            
