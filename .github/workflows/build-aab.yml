name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies & Build Web
        run: |
          npm install
          npm run build

      - name: Generate Android Project via Google Core Engine
        run: |
          mkdir -p android-build
          cd android-build
          npm init -y
          npm install @bubblewrap/core
          
          # Restore original Google Play upload keystore from GitHub Secrets
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Restoring Keystore from Secrets..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android.keystore
          else
            echo "No Secret found! Creating a temporary new one..."
            keytool -genkey -v -keystore android.keystore -alias localhub -keyalg RSA -keysize 2048 -validity 10000 -storepass localhub123456 -keypass localhub123456 -dname "CN=Toon Isra, OU=LocalHub, O=LocalHub, L=Bangkok, ST=Bangkok, C=TH"
          fi
          
          cat << 'INNER_EOF' > twa-manifest.json
          {
            "packageId": "com.toon.localhub",
            "host": "localhub-69fbe.web.app",
            "name": "LocalHub",
            "launcherName": "LocalHub",
            "themeColor": "#10B981",
            "themeColorDark": "#111827",
            "navigationColor": "#111827",
            "navigationColorDark": "#111827",
            "navigationDividerColor": "#000000",
            "navigationDividerColorDark": "#000000",
            "backgroundColor": "#111827",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://raw.githubusercontent.com/toonisra33/localhub/main/public/icon-512.png",
            "maskableIconUrl": "https://raw.githubusercontent.com/toonisra33/localhub/main/public/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "localhub"
            },
            "appVersionName": "1.0.2",
            "appVersionCode": 3,
            "shortcuts": [],
            "generatorApp": "bubblewrap-core",
            "webManifestUrl": "https://localhub-69fbe.web.app/manifest.json",
            "fallbackType": "customtabs",
            "features": {
              "locationDelegation": {
                "enabled": true
              },
              "playBilling": {
                "enabled": false
              }
            },
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "fullScopeUrl": "https://localhub-69fbe.web.app/",
            "minSdkVersion": 21,
            "orientation": "default",
            "fingerprints": []
          }
          INNER_EOF
          
          node -e "
            const { TwaManifest, TwaGenerator } = require('@bubblewrap/core');
            const fs = require('fs');
            async function build() {
              const data = JSON.parse(fs.readFileSync('./twa-manifest.json', 'utf8'));
              if (process.env.ANDROID_KEY_ALIAS) data.signingKey.alias = process.env.ANDROID_KEY_ALIAS;
              const manifest = new TwaManifest(data);
              const generator = new TwaGenerator();
              await generator.createTwaProject('./', manifest);
              console.log('Android TWA Project generated successfully!');
            }
            build().catch(err => { console.error(err); process.exit(1); });
          "

      - name: Build Signed AAB Bundle with Gradle
        run: |
          cd android-build
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease
          
          AAB_FILE=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          if [ -f "$AAB_FILE" ]; then
            STORE_PASS="${ANDROID_KEYSTORE_PASSWORD:-localhub123456}"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-localhub123456}"
            ALIAS="${ANDROID_KEY_ALIAS:-localhub}"
            jarsigner -keystore android.keystore -storepass "$STORE_PASS" -keypass "$KEY_PASS" "$AAB_FILE" "$ALIAS" || true
          fi

      - name: Upload Android App Bundle (.AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalHub-Android-Bundle-aab
          path: |
            android-build/app/build/outputs/bundle/release/*.aab
            android-build/app/build/outputs/apk/release/*.apk
            android-build/android.keystore
