<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient: Bright Vibrant Emerald & Mint to Deep Teal -->
    <linearGradient id="bgGrad" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#05d69e" />
      <stop offset="30%" stop-color="#00bf8a" />
      <stop offset="70%" stop-color="#00a374" />
      <stop offset="100%" stop-color="#008a62" />
    </linearGradient>

    <!-- Top Soft Highlight Glow -->
    <radialGradient id="topGlow" cx="50%" cy="12%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Bottom Depth Vignette -->
    <linearGradient id="bottomVignette" x1="50%" y1="65%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#004732" stop-opacity="0" />
      <stop offset="100%" stop-color="#004732" stop-opacity="0.22" />
    </linearGradient>

    <!-- White Marker Drop Shadow -->
    <filter id="pinShadow" x="-30%" y="-20%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#003d2b" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#00291d" flood-opacity="0.18" />
    </filter>

    <!-- Roof Outline Drop Shadow -->
    <filter id="roofShadow" x="-20%" y="-20%" width="140%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#003d2b" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#002419" flood-opacity="0.16" />
    </filter>

    <!-- 3D Heart Drop Shadow -->
    <filter id="heartShadow" x="-40%" y="-30%" width="180%" height="180%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="-2" dy="8" stdDeviation="8" flood-color="#550015" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <!-- Cutout House Inside Pin Gradient -->
    <linearGradient id="cutoutGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#008a63" />
      <stop offset="45%" stop-color="#00ab7d" />
      <stop offset="100%" stop-color="#05cc94" />
    </linearGradient>

    <!-- 3D Heart Gradient: Rich Coral / Crimson -->
    <linearGradient id="heartGrad" x1="20%" y1="5%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#ff6584" />
      <stop offset="35%" stop-color="#fa3b64" />
      <stop offset="75%" stop-color="#e61e4d" />
      <stop offset="100%" stop-color="#be0d37" />
    </linearGradient>

    <!-- Glossy Specular Reflection for Heart -->
    <linearGradient id="heartSpecular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Squircle Clip -->
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="118" ry="118" />
    </clipPath>
  </defs>

  <!-- Background Squircle -->
  <g clip-path="url(#squircleClip)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)" />
    <rect x="0" y="0" width="512" height="512" fill="url(#topGlow)" />
    <rect x="0" y="0" width="512" height="512" fill="url(#bottomVignette)" />
    <!-- Fine Edge Highlight -->
    <rect x="1.5" y="1.5" width="509" height="509" rx="116.5" ry="116.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.22" />
  </g>

  <!-- 1. Roof Outline (Floating Above Pin) -->
  <g filter="url(#roofShadow)">
    <!-- Chimney on Right Slope -->
    <rect
      x="323"
      y="134"
      width="27"
      height="46"
      rx="7"
      fill="#ffffff"
    />

    <!-- Main Gable Roof -->
    <path
      d="M 138 195 L 246 126 C 252.5 122, 259.5 122, 266 126 L 374 195"
      stroke="#ffffff"
      stroke-width="27"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>

  <!-- 2. White Map Pin Location Marker -->
  <g filter="url(#pinShadow)">
    <!-- Smooth Teardrop Pin with Softly Rounded Bottom Tip -->
    <path
      d="M 256 388
         C 251 380, 168 296, 168 252
         C 168 203, 207 164, 256 164
         C 305 164, 344 203, 344 252
         C 344 296, 261 380, 256 388 Z"
      fill="#ffffff"
    />
  </g>

  <!-- 3. Stylized House / Arrowhead Cutout with 4 Window Panes -->
  <g>
    <!-- House Roof / Arrowhead -->
    <path
      d="M 256 210
         L 298 262
         H 214
         Z"
      fill="url(#cutoutGrad)"
    />

    <!-- 4 Window Panes (2x2 Grid) -->
    <!-- Top-Left -->
    <rect x="235" y="267" width="19" height="19" rx="3" fill="url(#cutoutGrad)" />
    <!-- Top-Right -->
    <rect x="258" y="267" width="19" height="19" rx="3" fill="url(#cutoutGrad)" />
    <!-- Bottom-Left -->
    <rect x="235" y="290" width="19" height="19" rx="3" fill="url(#cutoutGrad)" />
    <!-- Bottom-Right -->
    <rect x="258" y="290" width="19" height="19" rx="3" fill="url(#cutoutGrad)" />

    <!-- Subtle Inner Top Bevel on Cutout -->
    <path
      d="M 256 210 L 298 262"
      stroke="#005e43"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-opacity="0.25"
      fill="none"
    />
  </g>

  <!-- 4. 3D Glossy Coral Red Heart -->
  <g transform="translate(326, 226) rotate(16)" filter="url(#heartShadow)">
    <!-- Main 3D Heart Body -->
    <path
      d="M 0 10
         C -2 4, -14 -13, -27 -7
         C -39 -1, -38 18, -27 29
         C -16 40, 0 54, 0 54
         C 0 54, 16 40, 27 29
         C 38 18, 39 -1, 27 -7
         C 14 -13, 2 4, 0 10 Z"
      fill="url(#heartGrad)"
      transform="scale(0.72) translate(0, -22)"
    />

    <!-- Soft 3D Specular Highlight (Upper Left Lobe) -->
    <ellipse
      cx="-13"
      cy="-11"
      rx="7.5"
      ry="5.5"
      transform="rotate(-28 -13 -11)"
      fill="url(#heartSpecular)"
    />

    <!-- Pinpoint Specular Gleam -->
    <circle
      cx="-7"
      cy="-6"
      r="2.2"
      fill="#ffffff"
      opacity="0.85"
    />
  </g>
</svg>
